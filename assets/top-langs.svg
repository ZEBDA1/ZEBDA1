    .lang-pct { font: 700 13px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #ffffff; }
  </style>
  <rect width="495" height="195" rx="4.5" fill="#0a0908" />
  
  <text x="30" y="38" class="title">Most Used Languages</text>
  
  <g>
    <rect x="30" y="55" width="412" height="8" rx="3" fill="#3178c6" /><rect x="442" y="55" width="7" height="8" rx="3" fill="#563d7c" /><rect x="449" y="55" width="3" height="8" rx="3" fill="#3572A5" /><rect x="452" y="55" width="3" height="8" rx="3" fill="#f1e05a" /><rect x="455" y="55" width="2" height="8" rx="3" fill="#e34c26" /><rect x="457" y="55" width="5" height="8" rx="3" fill="#8b5cf6" />
  </g>
  
  <g>
    <g transform="translate(30, 85)">
          <circle cx="5" cy="5" r="5" fill="#3178c6"/>
          <text x="18" y="9" class="lang-name">TypeScript</text>
          <text x="190" y="9" text-anchor="end" class="lang-pct">94.8%</text>
        </g><g transform="translate(250, 85)">
          <circle cx="5" cy="5" r="5" fill="#563d7c"/>
          <text x="18" y="9" class="lang-name">CSS</text>
          <text x="190" y="9" text-anchor="end" class="lang-pct">1.7%</text>
        </g><g transform="translate(30, 111)">
          <circle cx="5" cy="5" r="5" fill="#3572A5"/>
          <text x="18" y="9" class="lang-name">Python</text>
          <text x="190" y="9" text-anchor="end" class="lang-pct">0.9%</text>
        </g><g transform="translate(250, 111)">
          <circle cx="5" cy="5" r="5" fill="#f1e05a"/>
          <text x="18" y="9" class="lang-name">JavaScript</text>
          <text x="190" y="9" text-anchor="end" class="lang-pct">0.8%</text>
        </g><g transform="translate(30, 137)">
          <circle cx="5" cy="5" r="5" fill="#e34c26"/>
          <text x="18" y="9" class="lang-name">HTML</text>
          <text x="190" y="9" text-anchor="end" class="lang-pct">0.5%</text>
        </g><g transform="translate(250, 137)">
