<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <style>
    .title { font: 700 18px 'Segoe UI', Ubuntu, -apple-system, sans-serif; fill: #a78bfa; }
